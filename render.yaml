databases:
  - name: vetagenda-db
    plan: free
    databaseName: vetagenda
    user: vetagenda

services:
  - type: web
    plan: free
    name: vetagenda
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn vetagenda.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: vetagenda-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: LOAD_DEMO_DATA
        value: "True"
